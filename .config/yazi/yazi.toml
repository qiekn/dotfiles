# "$schema" = "https://yazi-rs.github.io/schemas/yazi.json"
# Keep Yazi's built-in defaults and only override the editor.

[opener]
edit = [
	{ run = 'nvim "$@"', desc = "nvim", block = true, for = "unix" },
	{ run = 'nvim %s',   desc = "nvim", block = true, for = "windows" },
]

[preview]
image_filter = "lanczos3"
max_width = 1000
max_height = 1000
